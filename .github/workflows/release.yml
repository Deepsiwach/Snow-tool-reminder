name: Build and publish SNOW Reminder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Set this build's version
        shell: pwsh
        run: |
          $patch = [int]$env:GITHUB_RUN_NUMBER + 3
          $version = "1.0.$patch"
          Set-Content -Path version.py -Value "APP_VERSION = `"$version`"" -NoNewline
          $installer = Get-Content installer.iss -Raw
          $installer = [regex]::Replace($installer, '(?m)^#define AppVersion ".*"$', "#define AppVersion `"$version`"")
          Set-Content -Path installer.iss -Value $installer
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build standalone app and installer
        run: .\build.ps1
        shell: pwsh

      - name: Create GitHub Release and upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $installer = Resolve-Path "dist\SNOW Reminder Setup.exe"
          if (-not $installer) { throw "The setup file was not built." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "SNOW Reminder $env:RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag $installer.Path --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedAsset = "SNOW Reminder Setup.exe" -replace "[^a-zA-Z0-9]", ""
          $normalizedAssets = @($assets | ForEach-Object { $_ -replace "[^a-zA-Z0-9]", "" })
          if ($normalizedAssets -notcontains $expectedAsset) { throw "The setup file was not attached to the release." }
        shell: pwsh
